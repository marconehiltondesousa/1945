<body>
<canvas id="c"></canvas>
<script>
(()=>{
"use strict";
const W=540,H=960,TAU=Math.PI*2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let K=1;
function resize(){
  const s=Math.min(innerWidth/W,innerHeight/H);
  K=Math.min(2,window.devicePixelRatio||1)*s;
  cv.style.width=W*s+'px';cv.style.height=H*s+'px';
  cv.width=Math.round(W*K);cv.height=Math.round(H*K);
}
addEventListener('resize',resize);resize();

const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hash(a,b){let h=(a*374761393+b*668265263)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296;}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}

/* ---------- glow sprites ---------- */
function mkGlow(rgb,size=64){
  const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');
  const gr=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  gr.addColorStop(0,`rgba(${rgb},1)`);gr.addColorStop(.3,`rgba(${rgb},.4)`);gr.addColorStop(1,`rgba(${rgb},0)`);
  g.fillStyle=gr;g.fillRect(0,0,size,size);return c;
}
const GL={smoke:mkGlow('34,30,26'),cyan:mkGlow('80,240,255'),mag:mkGlow('255,60,240'),orange:mkGlow('255,150,40'),yellow:mkGlow('255,235,90'),
  white:mkGlow('255,255,255'),green:mkGlow('90,255,150'),red:mkGlow('255,60,80')};
function glow(img,x,y,r,a=1){ctx.globalAlpha=a;ctx.drawImage(img,x-r,y-r,r*2,r*2);ctx.globalAlpha=1;}
const vig=(()=>{const c=document.createElement('canvas');c.width=W/2;c.height=H/2;const g=c.getContext('2d');
  const gr=g.createRadialGradient(W/4,H/4,H/8,W/4,H/4,H/2.1);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(6,5,0,.6)');
  g.fillStyle=gr;g.fillRect(0,0,W/2,H/2);return c;})();

/* ---------- audio ---------- */
let ac=null,mg=null,muted=false,nbuf=null;
function initAudio(){
  if(ac)return;
  try{ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.5;mg.connect(ac.destination);startMusic();}catch(e){ac=null;}
}
function tone(f,d,type,v,sl,at){
  if(!ac)return;const t=at||ac.currentTime;const o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+sl),t+d);
  g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.03);
}
function noise(d,v,fc,at){
  if(!ac)return;
  if(!nbuf){nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  const t=at||ac.currentTime;const s=ac.createBufferSource();s.buffer=nbuf;
  const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=fc||1200;
  const g=ac.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(mg);s.start(t);s.stop(t+d);
}
const SFX={
  shoot(){tone(880,.05,'square',.025,-500);},
  bomb(){tone(180,.18,'sawtooth',.07,-130);},
  boom(){noise(.35,.28,900);tone(110,.25,'sawtooth',.08,-80);},
  big(){noise(.9,.5,700);tone(70,.7,'sawtooth',.14,-50);},
  hit(){noise(.4,.4,2500);tone(300,.3,'square',.1,-220);},
  capture(){[523,659,784,1047].forEach((f,i)=>tone(f,.12,'square',.07,0,ac&&ac.currentTime+i*.07));},
  form(){tone(400,.12,'triangle',.12,500);tone(800,.1,'triangle',.08,-300,ac&&ac.currentTime+.08);},
  up(){[784,988,1175,1568].forEach((f,i)=>tone(f,.15,'triangle',.09,0,ac&&ac.currentTime+i*.08));},
  alarm(){for(let i=0;i<4;i++)tone(i%2?420:620,.25,'sawtooth',.08,0,ac&&ac.currentTime+i*.28);},
  over(){if(audioState==='ok')return;[392,330,262,196].forEach((f,i)=>tone(f,.4,'triangle',.12,0,ac&&ac.currentTime+i*.3));}
};
function sfx(n){try{if(ac)SFX[n]();}catch(e){}}
/* trilha por arquivos (pasta audio/); sem os arquivos, cai na música sintetizada */
const AFILES={credit:'credit.mp3',start:'start.mp3',main:'main.mp3',bi:'boss-intro.mp3',bl:'boss-loop.mp3',over:'gameover.mp3',win:'nameentry.mp3'};
const AUD={};let audioState='loading',audioOk=0,curKey=null,curEl=null,wasPaused=false;
(function loadAudio(){
  const ks=Object.keys(AFILES);
  ks.forEach(k=>{
    const a=new Audio();a.preload='auto';
    a.addEventListener('canplaythrough',()=>{if(++audioOk===ks.length&&audioState==='loading')audioState='ok';},{once:true});
    a.addEventListener('error',()=>{audioState='none';});
    a.src='audio/'+AFILES[k];AUD[k]=a;
  });
  setTimeout(()=>{if(audioState==='loading')audioState='none';},8000);
})();
function aStop(){for(const k in AUD){const a=AUD[k];a.pause();a.onended=null;try{a.currentTime=0;}catch(e){}}curEl=null;}
function aPlay(k,loop,then){const a=AUD[k];a.loop=!!loop;a.volume=muted?0:.5;a.onended=then||null;curEl=a;try{a.currentTime=0;}catch(e){}const p=a.play();if(p&&p.catch)p.catch(()=>{});}
function musicSync(){
  if(audioState!=='ok'||!ac)return;
  const st=G.state;
  const key=st==='brief'?'credit':st==='over'?'over':st==='win'?'win':st==='play'?(G.boss?'boss':'main'):null;
  if(key!==curKey){
    const prev=curKey;curKey=key;aStop();
    if(key==='credit')aPlay('credit',false);
    else if(key==='main'){
      if(prev==='credit')aPlay('start',false,()=>{if(curKey==='main')aPlay('main',true);});
      else aPlay('main',true);
    }
    else if(key==='boss')aPlay('bi',false,()=>{if(curKey==='boss')aPlay('bl',true);});
    else if(key==='over')aPlay('over',false);
    else if(key==='win')aPlay('win',true);
  }
  if(curEl){
    curEl.volume=muted?0:.5;
    if(paused!==wasPaused){if(paused)curEl.pause();else{const p=curEl.play();if(p&&p.catch)p.catch(()=>{});}}
  }
  wasPaused=paused;
}
const SC=[0,3,5,7,10];let mstep=0,nextT=0;
const mf=n=>55*Math.pow(2,n/12);
function musicStep(t){
  const s=mstep++;
  const boss=G&&G.boss;
  const bass=[0,0,12,0,0,7,0,5][s%8]+(((s>>3)%4)===3?5:0);
  tone(mf(bass),.16,'sawtooth',.06,0,t);
  if(s%4===0)tone(130,.12,'sine',.22,-95,t);
  if(s%2===1)noise(.04,.04,6000,t);
  const idx=[0,2,4,2,3,1,4,2][s%8]+((s>>4)%2)*1;
  const deg=SC[idx%5]+12*Math.floor(idx/5)+24;
  tone(mf(deg),.12,'square',boss?.035:.025,0,t);
  if(boss&&s%8===4)noise(.1,.12,3000,t);
}
function startMusic(){
  nextT=ac.currentTime+.1;
  setInterval(()=>{if(!ac)return;while(nextT<ac.currentTime+.3){if(audioState==='none'&&G&&G.state!=='over'&&!paused)musicStep(nextT);nextT+=60/150/2;}},60);
}

/* ---------- input ---------- */
const keys={};let paused=false,fireKey=false,ptr=null,ptrFire=false;
const FBTN={x:W-92,y:H-98,w:76,h:76};
/* ---------- tela cheia (PC e celular) ---------- */
const FSB={x:W-56,y:102,w:40,h:40};let fsPseudo=false,fsPress=false,toastTxt='',toastUntil=0;
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement||null;
const fsOn=()=>!!fsEl()||fsPseudo;
function toast(t){toastTxt=t;toastUntil=performance.now()+5200;}
function toggleFS(){
  const d=document,el=d.documentElement;
  if(fsEl()){try{(d.exitFullscreen||d.webkitExitFullscreen).call(d);}catch(e){}return;}
  if(fsPseudo){fsPseudo=false;d.body.classList.remove('pfs');resize();return;}
  const req=el.requestFullscreen||el.webkitRequestFullscreen;
  const pseudo=()=>{fsPseudo=true;d.body.classList.add('pfs');resize();setTimeout(()=>scrollTo(0,1),60);toast('Este navegador não libera tela cheia. No iPhone: Compartilhar > Adicionar à Tela de Início.');};
  if(!req){pseudo();return;}
  try{const p=req.call(el,{navigationUI:'hide'});
    if(p&&p.then)p.then(()=>{try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('portrait').catch(()=>{});}catch(e){}},pseudo);}
  catch(e){pseudo();}
}
['fullscreenchange','webkitfullscreenchange'].forEach(n=>document.addEventListener(n,()=>resize()));
const inFS=q=>q.x>FSB.x-8&&q.x<FSB.x+FSB.w+8&&q.y>FSB.y-8&&q.y<FSB.y+FSB.h+8;
addEventListener('keydown',e=>{
  initAudio();
  const k=e.key.toLowerCase();
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
  if(e.repeat)return;
  keys[k]=true;
  if(k==='f'){toggleFS();return;}
  if(G.state==='title'&&k==='d'){toggleEasy();return;}
  if(G.state==='brief'&&(k==='arrowleft'||k==='backspace'||k==='a')){briefBack();return;}
  if(G.state!=='play'){if(k===' '||k==='enter'||k==='z'||(G.state==='brief'&&(k==='arrowright'||k==='d')))advance();return;}
  if(k==='x'||k==='shift'||k==='k'||k==='e')changeForm();
  if(k==='1'||k==='2'||k==='3'||k==='4')setForm(+k-1);
  if(k==='p'||k==='escape')paused=!paused;
  if(k==='m'){muted=!muted;if(mg)mg.gain.value=muted?0:.5;}
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{paused=true;for(const k in keys)keys[k]=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden)paused=true;});
function toCanvas(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{
  initAudio();const q=toCanvas(e);
  if(e.button!==2&&inFS(q)){fsPress=true;return;}
  if(e.button===2){if(G.state==='play')changeForm();return;}
  if(G.state==='title'&&q.y>850&&q.y<905){toggleEasy();return;}
  if(G.state==='brief'){bsw={x:q.x};return;}
  if(G.state!=='play'){advance();return;}
  if(paused){paused=false;return;}
  for(let i=0;i<4;i++){const b=PAN(i);if(q.x>b.x&&q.x<b.x+b.w&&q.y>b.y&&q.y<b.y+b.h){setForm(i);return;}}
  if(q.x>FBTN.x&&q.x<FBTN.x+FBTN.w&&q.y>FBTN.y&&q.y<FBTN.y+FBTN.h){changeForm();return;}
  ptr={id:e.pointerId,x:q.x,y:q.y};ptrFire=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
let bsw=null;
cv.addEventListener('pointerup',e=>{
  const q=toCanvas(e);
  if(fsPress){fsPress=false;if(inFS(q))toggleFS();return;}
  if(bsw&&G.state==='brief'){const dx=q.x-bsw.x;bsw=null;
    if(Math.abs(dx)>50){if(dx<0)advance();else briefBack();return;}
    if((G.briefPage||0)>0&&q.x>BK.x&&q.x<BK.x+BK.w&&q.y>BK.y&&q.y<BK.y+BK.h){briefBack();return;}
    advance();}
});
cv.addEventListener('pointercancel',()=>{fsPress=false;});
cv.addEventListener('pointermove',e=>{
  if(!ptr||e.pointerId!==ptr.id||G.state!=='play'||paused)return;
  const q=toCanvas(e);const p=G.p;
  if(p.dead<=0){p.x=clamp(p.x+(q.x-ptr.x)*1.2,22,W-22);p.y=clamp(p.y+(q.y-ptr.y)*1.2,80,yMax());}
  ptr.x=q.x;ptr.y=q.y;
});
const endPtr=e=>{if(ptr&&e.pointerId===ptr.id){ptr=null;ptrFire=false;}};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- game state ---------- */
const STG=[
{name:'LONDRES',sub:'Londres, 1944 — o céu sobre a cidade ferida',w:[.3,.2,.14,.14,0,0,.22],gx:[40,500],grade:[214,220,232],bt:52,hp:150},
{name:'NORMANDIA',sub:'Costa da Normandia, junho de 1944',w:[.2,.14,.1,.08,.2,.28,0],gx:[300,500],grade:[246,238,214],bt:54,hp:190},
{name:'ARDENAS',sub:'Floresta das Ardenas — inverno de 1944',w:[.18,.1,.06,.14,.32,.2,0],gx:[40,500],grade:[214,226,242],bt:56,hp:240},
{name:'VALE DO RENO',sub:'Vale do Reno, março de 1945',w:[.2,.14,.1,.1,.16,.3,0],gx:[40,500],grade:[248,228,184],bt:58,hp:290},
{name:'BERLIM',sub:'Berlim, abril de 1945 — a queda',w:[.2,.18,.12,.16,.14,.2,0],gx:[40,500],grade:[238,198,162],bt:60,hp:340},
{name:'HIROSHIMA E NAGASAKI',sub:'Japão, agosto de 1945 — o último céu',w:[.26,.2,.14,.14,0,.26,0],gx:[40,500],grade:[246,222,214],bt:66,hp:430}
];
const DIST=STG.map(x=>x.name);
let easy=true;try{const v=localStorage.getItem('neonscramble.easy');if(v!==null)easy=v==='1';}catch(e){}
let G=null,scroll=0,hi=0;
try{hi=+localStorage.getItem('neonscramble.hi')||0;}catch(e){}
function newGame(state){
  G={state,t:0,score:0,lives:easy?5:3,stage:0,themes:[{row:-1e9,s:0}],grade:[214,220,232],cst:0,nag:false,winT:0,briefT:0,winPage:0,combo:0,comboT:0,mult:1,
    p:{x:W/2,y:H-170,inv:2,fire:0,bomb:0,form:3,fcd:0,dead:0,tilt:0},
    wing:[],pb:[],bombs:[],eb:[],en:[],rec:[],pk:[],parts:[],rings:[],fl:[],
    waveT:1.5,recT:3,bossT:0,boss:null,shake:0,banner:null,overT:0,firstWave:true};
  if(state==='play'){G.state='brief';G.briefT=0;G.briefPage=0;G.briefPT=0;}
}
function startGame(){newGame('play');paused=false;}
function briefBack(){if(G.state==='brief'&&(G.briefPage||0)>0){G.briefPage--;G.briefPT=0;}}
function advance(){
  if(G.state==='brief'){if(G.briefT<=.5)return;const pg=G.briefPage||0;if(pg<2){G.briefPage=pg+1;G.briefPT=0;return;}G.state='play';stageBanner(Math.min(G.stage,5));return;}
  if(G.state==='win'){if(G.winT<2.5)return;if(G.winPage===0){G.winPage=1;return;}}
  startGame();
}
function toggleEasy(){easy=!easy;try{localStorage.setItem('neonscramble.easy',easy?'1':'0');}catch(e){}}
function banner(text,t,col,sub){G.banner={text,t,max:t,col:col||'#efe6c8',sub};}
function stageBanner(i){const q=STG[i];banner((i+1)+'. '+q.name,3.2,'#efe6c8',q.sub);}
G=null;newGame('title');

const FORMS=[{n:'DELTA',d:'AR',c:'cyan'},{n:'CRUZ',d:'SOLO',c:'orange'},{n:'HÍBRIDA',d:'AR+SOLO',c:'mag'},{n:'COLUNA',d:'AR+SOLO',c:'gold'}];
function offs(f,i){
  return[[[-34,24],[34,24],[-68,48],[68,48]],[[-42,0],[42,0],[0,-44],[0,44]],[[-38,6],[38,6],[-76,10],[76,10]],[[0,30],[0,60],[0,90],[0,120]]][f][i];
}
function yMax(){let m=0;for(let i=0;i<G.wing.length;i++)m=Math.max(m,offs(G.p.form,i)[1]);return H-100-Math.max(0,m-40);}
function setForm(i){
  const p=G.p;if(p.dead>0||p.form===i)return;
  p.form=i;sfx('form');
  G.rings.push({x:p.x,y:p.y,r:10,max:90,life:.35,col:'#f0e0a0'});
}
function changeForm(){setForm((G.p.form+1)%4);}

/* ---------- effects ---------- */
function boom(x,y,n,col,shake){
  for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(40,260)*clamp(n/22,.5,1.6);
    G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.3,.8),max:.8,sz:rnd(10,26),g:col||'orange'});}
  for(let i=0;i<Math.ceil(n/3);i++){const a=rnd(0,TAU),sp=rnd(10,70);G.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(.9,1.7),max:1.7,sz:rnd(16,32),g:'smoke'});}
  G.rings.push({x,y,r:6,max:n*2.4+20,life:.4,col:'#ffb35a'});
  G.shake=Math.max(G.shake,shake||n/6);
}
function floatTxt(x,y,s,col){G.fl.push({x,y,s,col:col||'#fff',life:.9});}
function ring(x,y,m,c){G.rings.push({x,y,r:6,max:m,life:.35,col:c||'#ffb35a'});}
function addScore(pts,x,y){
  G.combo++;G.comboT=2;G.mult=1+Math.min(4,Math.floor(G.combo/5));
  const v=pts*G.mult;G.score+=v;if(x!==undefined)floatTxt(x,y,v,G.mult>1?'#f0b43c':'#fff');
}

/* ---------- enemies ---------- */
const ET={drone:{hp:1,r:14,air:1,pts:100},dart:{hp:1,r:13,air:1,pts:150},gun:{hp:6,r:24,air:1,pts:600},
  tank:{hp:3,r:18,air:0,pts:250},turret:{hp:2,r:15,air:0,pts:200},bunker:{hp:7,r:26,air:0,pts:500},balloon:{hp:4,r:22,air:1,pts:150}};
function addEn(type,x,y,o){
  const c=ET[type];const sc=(type==='gun'||type==='bunker')?1+G.stage*.25:1;
  const e=Object.assign({type,x,y,x0:x,y0:y,hp:Math.ceil(c.hp*sc),r:c.r,air:c.air,pts:c.pts,age:0,delay:0,flash:0,
    sh:rnd(.6,1.8),dead:false,path:'sine',amp:110,ph:0,aim:Math.PI/2,state:0,vx:0,vy:0},o||{});
  G.en.push(e);return e;
}
function ebul(x,y,ang,sp,r){
  if(G.eb.length>380)return;
  G.eb.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:r||5});
}
const bsp=()=>Math.min(260,170+G.stage*14)*(easy?.8:1);
const aimAt=(x,y)=>Math.atan2(G.p.y-y,G.p.x-x);
function waveDrones(n){const x0=rnd(140,400);for(let i=0;i<n;i++)addEn('drone',x0,-30,{delay:i*.32,amp:rnd(90,130)});}
function waveSweep(){const L=Math.random()<.5,n=5+Math.min(3,G.stage);
  for(let i=0;i<n;i++)addEn('drone',L?-30:W+30,rnd(60,200),{path:'line',delay:i*.35,vx:(L?1:-1)*170,vy:110});}
function waveDarts(){const n=3+Math.min(3,G.stage),x0=rnd(150,390);
  for(let i=0;i<n;i++){const o=(i-(n-1)/2);addEn('dart',x0+o*54,-30-Math.abs(o)*28,{delay:Math.abs(o)*.18});}}
function waveGun(){const n=1+(G.stage>1&&Math.random()<.4?1:0);for(let i=0;i<n;i++)addEn('gun',n===1?rnd(150,390):150+i*240,-40);}
function landMin(wy){const st=Math.min(G.stage,5);if(st===1)return SHORE[1](wy)+34;if(st===5&&G.nag)return SHORE[5](wy)+34;return 0;}
function landClamp(e){const m=landMin(scroll-e.y);if(e.x<m){e.x=m;if(e.vx<0)e.vx=-e.vx;}}
function badX(x){
  const wy=scroll+40,st=Math.min(G.stage,5);
  if(st===1||(st===5&&G.nag))return x<landMin(wy);
  if(st===0||st===3||st===4){return Math.abs(x-RIV[st](wy))<(st===3?85:st===4?50:70);}
  if(st===5&&!G.nag){for(let i=0;i<3;i++)if(Math.abs(x-hiroX(i,wy))<40)return true;}
  return false;
}

function wrapText(s,max,size){
  ctx.font=`500 ${size}px Oswald,sans-serif`;const words=s.split(' '),out=[];let line='';
  for(const w of words){const t=line?line+' '+w:w,m=ctx.measureText(t),wd=(m&&m.width)||t.length*size*.48;if(wd>max&&line){out.push(line);line=w;}else line=t;}
  if(line)out.push(line);return out;
}
const BK={x:36,y:826,w:150,h:70},NX={x:200,y:826,w:304,h:70};
function briefFit(paras,maxW,avail,maxFs){
  let out=null;
  for(let fs=maxFs;fs>=22;fs--){const lh=Math.round(fs*1.34),L=paras.map(t=>wrapText(t,maxW,fs));let n=0;L.forEach(a=>n+=a.length);
    out={fs,lh,L,h:n*lh+(L.length-1)*16};if(out.h<=avail)break;}
  return out;
}

const TL=[['1940–44','Londres','bombardeios, Blitz e bombas voadoras'],['6 jun 1944','Normandia','o Dia D, início da libertação'],['dez 1944–jan 1945','Ardenas','último grande ataque alemão'],

/* ---------- render ---------- */
function render(){
  ctx.setTransform(K,0,0,K,0,0);
  const sh=G.shake;
  ctx.save();if(sh>0)ctx.translate(rnd(-sh,sh),rnd(-sh,sh));
  drawBG();
  ctx.globalCompositeOperation='multiply';ctx.fillStyle=`rgb(${G.grade[0]|0},${G.grade[1]|0},${G.grade[2]|0})`;ctx.fillRect(-20,-20,W+40,H+40);ctx.globalCompositeOperation='source-over';

  for(const q of G.parts)if(q.g==='smoke'){const k=Math.max(0,q.life/q.max);glow(GL.smoke,q.x,q.y,q.sz*(2-k),k*.55);}

    ctx.fillStyle='#1f3a22';ctx.strokeStyle='#8fe39a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(k.x,k.y,13,0,TAU);ctx.fill();ctx.stroke();txt('1UP',k.x,k.y+4,10,'#8fe39a','center','Oswald',600);}

/* ---------- loop ---------- */
let last=0;
function frame(ts){

}
