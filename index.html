<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Scramble 1945 — Formação Aérea</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0b0c08;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#0b0c08;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{
"use strict";
const W=540,H=960,TAU=Math.PI*2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let K=1;
function resize(){
  const s=Math.min(innerWidth/W,innerHeight/H);
  K=Math.min(2,window.devicePixelRatio||1)*s;
  cv.style.width=W*s+'px';cv.style.height=H*s+'px';
  cv.width=Math.round(W*K);cv.height=Math.round(H*K);
}
addEventListener('resize',resize);resize();

const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hash(a,b){let h=(a*374761393+b*668265263)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296;}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}

/* ---------- glow sprites ---------- */
function mkGlow(rgb,size=64){
  const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');
  const gr=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  gr.addColorStop(0,`rgba(${rgb},1)`);gr.addColorStop(.3,`rgba(${rgb},.4)`);gr.addColorStop(1,`rgba(${rgb},0)`);
  g.fillStyle=gr;g.fillRect(0,0,size,size);return c;
}
const GL={smoke:mkGlow('34,30,26'),cyan:mkGlow('80,240,255'),mag:mkGlow('255,60,240'),orange:mkGlow('255,150,40'),yellow:mkGlow('255,235,90'),
  white:mkGlow('255,255,255'),green:mkGlow('90,255,150'),red:mkGlow('255,60,80')};
function glow(img,x,y,r,a=1){ctx.globalAlpha=a;ctx.drawImage(img,x-r,y-r,r*2,r*2);ctx.globalAlpha=1;}
const vig=(()=>{const c=document.createElement('canvas');c.width=W/2;c.height=H/2;const g=c.getContext('2d');
  const gr=g.createRadialGradient(W/4,H/4,H/8,W/4,H/4,H/2.1);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(6,5,0,.6)');
  g.fillStyle=gr;g.fillRect(0,0,W/2,H/2);return c;})();

/* ---------- audio ---------- */
let ac=null,mg=null,muted=false,nbuf=null;
function initAudio(){
  if(ac)return;
  try{ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.5;mg.connect(ac.destination);startMusic();}catch(e){ac=null;}
}
function tone(f,d,type,v,sl,at){
  if(!ac)return;const t=at||ac.currentTime;const o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+sl),t+d);
  g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.03);
}
function noise(d,v,fc,at){
  if(!ac)return;
  if(!nbuf){nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  const t=at||ac.currentTime;const s=ac.createBufferSource();s.buffer=nbuf;
  const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=fc||1200;
  const g=ac.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(mg);s.start(t);s.stop(t+d);
}
const SFX={
  shoot(){tone(880,.05,'square',.025,-500);},
  bomb(){tone(180,.18,'sawtooth',.07,-130);},
  boom(){noise(.35,.28,900);tone(110,.25,'sawtooth',.08,-80);},
  big(){noise(.9,.5,700);tone(70,.7,'sawtooth',.14,-50);},
  hit(){noise(.4,.4,2500);tone(300,.3,'square',.1,-220);},
  capture(){[523,659,784,1047].forEach((f,i)=>tone(f,.12,'square',.07,0,ac&&ac.currentTime+i*.07));},
  form(){tone(400,.12,'triangle',.12,500);tone(800,.1,'triangle',.08,-300,ac&&ac.currentTime+.08);},
  up(){[784,988,1175,1568].forEach((f,i)=>tone(f,.15,'triangle',.09,0,ac&&ac.currentTime+i*.08));},
  alarm(){for(let i=0;i<4;i++)tone(i%2?420:620,.25,'sawtooth',.08,0,ac&&ac.currentTime+i*.28);},
  over(){[392,330,262,196].forEach((f,i)=>tone(f,.4,'triangle',.12,0,ac&&ac.currentTime+i*.3));}
};
function sfx(n){try{if(ac)SFX[n]();}catch(e){}}
const SC=[0,3,5,7,10];let mstep=0,nextT=0;
const mf=n=>55*Math.pow(2,n/12);
function musicStep(t){
  const s=mstep++;
  const boss=G&&G.boss;
  const bass=[0,0,12,0,0,7,0,5][s%8]+(((s>>3)%4)===3?5:0);
  tone(mf(bass),.16,'sawtooth',.06,0,t);
  if(s%4===0)tone(130,.12,'sine',.22,-95,t);
  if(s%2===1)noise(.04,.04,6000,t);
  const idx=[0,2,4,2,3,1,4,2][s%8]+((s>>4)%2)*1;
  const deg=SC[idx%5]+12*Math.floor(idx/5)+24;
  tone(mf(deg),.12,'square',boss?.035:.025,0,t);
  if(boss&&s%8===4)noise(.1,.12,3000,t);
}
function startMusic(){
  nextT=ac.currentTime+.1;
  setInterval(()=>{if(!ac)return;while(nextT<ac.currentTime+.3){if(G&&G.state!=='over'&&!paused)musicStep(nextT);nextT+=60/150/2;}},60);
}

/* ---------- input ---------- */
const keys={};let paused=false,fireKey=false,ptr=null,ptrFire=false;
const FBTN={x:W-92,y:H-98,w:76,h:76};
addEventListener('keydown',e=>{
  initAudio();
  const k=e.key.toLowerCase();
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
  if(e.repeat)return;
  keys[k]=true;
  if(G.state==='title'&&k==='d'){toggleEasy();return;}
  if(G.state!=='play'){if(k===' '||k==='enter'||k==='z')advance();return;}
  if(k==='x'||k==='shift'||k==='k'||k==='e')changeForm();
  if(k==='1'||k==='2'||k==='3')setForm(+k-1);
  if(k==='p'||k==='escape')paused=!paused;
  if(k==='m'){muted=!muted;if(mg)mg.gain.value=muted?0:.5;}
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{paused=true;for(const k in keys)keys[k]=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden)paused=true;});
function toCanvas(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{
  initAudio();const q=toCanvas(e);
  if(e.button===2){if(G.state==='play')changeForm();return;}
  if(G.state==='title'&&q.y>850&&q.y<905){toggleEasy();return;}
  if(G.state!=='play'){advance();return;}
  if(paused){paused=false;return;}
  for(let i=0;i<3;i++){const b=PAN(i);if(q.x>b.x&&q.x<b.x+b.w&&q.y>b.y&&q.y<b.y+b.h){setForm(i);return;}}
  if(q.x>FBTN.x&&q.x<FBTN.x+FBTN.w&&q.y>FBTN.y&&q.y<FBTN.y+FBTN.h){changeForm();return;}
  ptr={id:e.pointerId,x:q.x,y:q.y};ptrFire=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(!ptr||e.pointerId!==ptr.id||G.state!=='play'||paused)return;
  const q=toCanvas(e);const p=G.p;
  if(p.dead<=0){p.x=clamp(p.x+(q.x-ptr.x)*1.2,22,W-22);p.y=clamp(p.y+(q.y-ptr.y)*1.2,80,H-100);}
  ptr.x=q.x;ptr.y=q.y;
});
const endPtr=e=>{if(ptr&&e.pointerId===ptr.id){ptr=null;ptrFire=false;}};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- game state ---------- */
const STG=[
{name:'LONDRES',sub:'Londres, 1944 — o céu sobre a cidade ferida',w:[.3,.2,.14,.14,0,0,.22],gx:[40,500],grade:[214,220,232],bt:52,hp:150},
{name:'NORMANDIA',sub:'Costa da Normandia, junho de 1944',w:[.2,.14,.1,.08,.2,.28,0],gx:[300,500],grade:[246,238,214],bt:54,hp:190},
{name:'ARDENAS',sub:'Floresta das Ardenas — inverno de 1944',w:[.18,.1,.06,.14,.32,.2,0],gx:[40,500],grade:[214,226,242],bt:56,hp:240},
{name:'VALE DO RENO',sub:'Vale do Reno, março de 1945',w:[.2,.14,.1,.1,.16,.3,0],gx:[40,500],grade:[248,228,184],bt:58,hp:290},
{name:'BERLIM',sub:'Berlim, abril de 1945 — a queda',w:[.2,.18,.12,.16,.14,.2,0],gx:[40,500],grade:[238,198,162],bt:60,hp:340},
{name:'HIROSHIMA E NAGASAKI',sub:'Japão, agosto de 1945 — o último céu',w:[.26,.2,.14,.14,0,.26,0],gx:[40,500],grade:[246,222,214],bt:66,hp:430}
];
const DIST=STG.map(x=>x.name);
let easy=true;try{const v=localStorage.getItem('neonscramble.easy');if(v!==null)easy=v==='1';}catch(e){}
let G=null,scroll=0,hi=0;
try{hi=+localStorage.getItem('neonscramble.hi')||0;}catch(e){}
function newGame(state){
  G={state,t:0,score:0,lives:easy?5:3,stage:0,themes:[{row:-1e9,s:0}],grade:[214,220,232],cst:0,nag:false,winT:0,briefT:0,winPage:0,combo:0,comboT:0,mult:1,
    p:{x:W/2,y:H-170,inv:2,fire:0,bomb:0,form:0,fcd:0,dead:0,tilt:0},
    wing:[],pb:[],bombs:[],eb:[],en:[],rec:[],pk:[],parts:[],rings:[],fl:[],
    waveT:1.5,recT:3,bossT:0,boss:null,shake:0,banner:null,overT:0,firstWave:true};
  if(state==='play'){G.state='brief';G.briefT=0;}
}
function startGame(){newGame('play');paused=false;}
function advance(){
  if(G.state==='brief'){if(G.briefT>.5){G.state='play';stageBanner(Math.min(G.stage,5));}return;}
  if(G.state==='win'){if(G.winT<2.5)return;if(G.winPage===0){G.winPage=1;return;}}
  startGame();
}
function toggleEasy(){easy=!easy;try{localStorage.setItem('neonscramble.easy',easy?'1':'0');}catch(e){}}
function banner(text,t,col,sub){G.banner={text,t,max:t,col:col||'#efe6c8',sub};}
function stageBanner(i){const q=STG[i];banner((i+1)+'. '+q.name,3.2,'#efe6c8',q.sub);}
G=null;newGame('title');

const FORMS=[{n:'DELTA',d:'AR',c:'cyan'},{n:'CRUZ',d:'SOLO',c:'orange'},{n:'HÍBRIDA',d:'AR+SOLO',c:'mag'}];
function offs(f,i){
  return[[[-34,24],[34,24],[-68,48],[68,48]],[[-42,0],[42,0],[0,-44],[0,44]],[[-38,6],[38,6],[-76,10],[76,10]]][f][i];
}
function setForm(i){
  const p=G.p;if(p.dead>0||p.form===i)return;
  p.form=i;sfx('form');
  G.rings.push({x:p.x,y:p.y,r:10,max:90,life:.35,col:'#f0e0a0'});
}
function changeForm(){setForm((G.p.form+1)%3);}

/* ---------- effects ---------- */
function boom(x,y,n,col,shake){
  for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(40,260)*clamp(n/22,.5,1.6);
    G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.3,.8),max:.8,sz:rnd(10,26),g:col||'orange'});}
  for(let i=0;i<Math.ceil(n/3);i++){const a=rnd(0,TAU),sp=rnd(10,70);G.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(.9,1.7),max:1.7,sz:rnd(16,32),g:'smoke'});}
  G.rings.push({x,y,r:6,max:n*2.4+20,life:.4,col:'#ffb35a'});
  G.shake=Math.max(G.shake,shake||n/6);
}
function floatTxt(x,y,s,col){G.fl.push({x,y,s,col:col||'#fff',life:.9});}
function ring(x,y,m,c){G.rings.push({x,y,r:6,max:m,life:.35,col:c||'#ffb35a'});}
function addScore(pts,x,y){
  G.combo++;G.comboT=2;G.mult=1+Math.min(4,Math.floor(G.combo/5));
  const v=pts*G.mult;G.score+=v;if(x!==undefined)floatTxt(x,y,v,G.mult>1?'#f0b43c':'#fff');
}

/* ---------- enemies ---------- */
const ET={drone:{hp:1,r:14,air:1,pts:100},dart:{hp:1,r:13,air:1,pts:150},gun:{hp:6,r:24,air:1,pts:600},
  tank:{hp:3,r:18,air:0,pts:250},turret:{hp:2,r:15,air:0,pts:200},bunker:{hp:7,r:26,air:0,pts:500},balloon:{hp:4,r:22,air:1,pts:150}};
function addEn(type,x,y,o){
  const c=ET[type];const sc=(type==='gun'||type==='bunker')?1+G.stage*.25:1;
  const e=Object.assign({type,x,y,x0:x,y0:y,hp:Math.ceil(c.hp*sc),r:c.r,air:c.air,pts:c.pts,age:0,delay:0,flash:0,
    sh:rnd(.6,1.8),dead:false,path:'sine',amp:110,ph:0,aim:Math.PI/2,state:0,vx:0,vy:0},o||{});
  G.en.push(e);return e;
}
function ebul(x,y,ang,sp,r){
  if(G.eb.length>380)return;
  G.eb.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r:r||5});
}
const bsp=()=>Math.min(260,170+G.stage*14)*(easy?.8:1);
const aimAt=(x,y)=>Math.atan2(G.p.y-y,G.p.x-x);
function waveDrones(n){const x0=rnd(140,400);for(let i=0;i<n;i++)addEn('drone',x0,-30,{delay:i*.32,amp:rnd(90,130)});}
function waveSweep(){const L=Math.random()<.5,n=5+Math.min(3,G.stage);
  for(let i=0;i<n;i++)addEn('drone',L?-30:W+30,rnd(60,200),{path:'line',delay:i*.35,vx:(L?1:-1)*170,vy:110});}
function waveDarts(){const n=3+Math.min(3,G.stage),x0=rnd(150,390);
  for(let i=0;i<n;i++){const o=(i-(n-1)/2);addEn('dart',x0+o*54,-30-Math.abs(o)*28,{delay:Math.abs(o)*.18});}}
function waveGun(){const n=1+(G.stage>1&&Math.random()<.4?1:0);for(let i=0;i<n;i++)addEn('gun',n===1?rnd(150,390):150+i*240,-40);}
function badX(x){
  const wy=scroll+40,st=Math.min(G.stage,5);
  if(st===0||st===3||st===4){return Math.abs(x-RIV[st](wy))<(st===3?85:st===4?50:70);}
  if(st===5&&!G.nag){for(let i=0;i<3;i++)if(Math.abs(x-hiroX(i,wy))<40)return true;}
  return false;
}
function pickX(){const g=STG[Math.min(G.stage,5)];let lo=g.gx[0];const hi2=g.gx[1];if(G.stage===5&&G.nag)lo=230;
  for(let i=0;i<8;i++){const x=rnd(lo,hi2);if(!badX(x))return x;}return rnd(lo,hi2);}
function waveTanks(){const n=2+Math.min(2,G.stage),x0=pickX();for(let i=0;i<n;i++)addEn('tank',x0,-40-i*80,{vx:(Math.random()<.5?-1:1)*30});}
function waveGround(){
  if(Math.random()<.5){const n=2+Math.floor(Math.random()*2);for(let i=0;i<n;i++)addEn('turret',pickX(),-30-i*70);}
  else addEn('bunker',pickX(),-50);
}
function waveBalloons(){const n=3+Math.floor(Math.random()*2);for(let i=0;i<n;i++)addEn('balloon',rnd(60,W-60),-40-i*90,{ph:rnd(0,6)});}
function director(dt){
  if(G.boss)return;
  const S=STG[Math.min(G.stage,5)];
  G.bossT+=dt;
  if(G.bossT>S.bt&&G.en.length<4){spawnBoss();return;}
  G.waveT-=dt;if(G.waveT>0)return;
  const d=Math.min(2.2,1+G.stage*.22+G.t/320);
  if(G.firstWave){G.firstWave=false;waveDrones(5);G.waveT=3;return;}
  let tot=0;for(const w of S.w)tot+=w;
  let r=Math.random()*tot,i=0;for(;i<6;i++){r-=S.w[i];if(r<=0)break;}
  [()=>waveDrones(Math.min(8,5+G.stage)),waveDarts,waveSweep,waveGun,waveTanks,waveGround,waveBalloons][i]();
  G.waveT=rnd(2.4,3.8)/d;
}
const BD=[{hw:104,hh:60,y:170,n:2},{hw:34,hh:106,y:195,n:2},{hw:64,hh:78,y:190,n:2.4},{hw:150,hh:32,y:170,n:4},{hw:118,hh:52,y:170,n:2},{hw:128,hh:82,y:175,n:3}];
function spawnBoss(){
  const st=Math.min(G.stage,5),d=BD[st],hp=Math.round(STG[st].hp*(easy?.7:1));
  G.boss={x:W/2,y:-190,hp,max:hp,t:0,sp:0,ang:0,flash:0,dying:0,t2:0,t3:0,tt:[0,0,0,0,0,0],ring:0,hw:d.hw,hh:d.hh,n:d.n,y0:d.y};
  banner('ALERTA — '+BOSSN[st],2.6,'#e2553f');sfx('alarm');
}
function hurt(e,d){
  if(e.dead)return;
  e.hp-=d;e.flash=.08;
  if(e.hp<=0)killEn(e);
}
function killEn(e){
  e.dead=true;
  boom(e.x,e.y,e.type==='gun'||e.type==='bunker'?26:14,'orange',e.type==='gun'?5:2.5);
  addScore(e.pts,e.x,e.y);sfx('boom');
  if(e.type==='gun'&&Math.random()<.14)G.pk.push({x:e.x,y:e.y,t:0});
}
function updateEn(e,dt){
  if(e.delay>0){e.delay-=dt;return;}
  e.age+=dt;if(e.flash>0)e.flash-=dt;
  const p=G.p;
  switch(e.type){
  case 'balloon':
    e.y+=75*dt;e.x+=Math.sin(e.age*1.2+e.ph)*14*dt;if(e.y>H+60)e.dead=true;break;
  case 'drone':
    if(e.path==='sine'){e.y=-30+e.age*(120+G.stage*8);e.x=e.x0+Math.sin(e.age*2.2+e.ph)*e.amp;}
    else{e.x=e.x0+e.vx*e.age;e.y=e.y0+e.vy*e.age;}
    e.sh-=dt;if(e.sh<=0&&e.y>0&&e.y<H*.6){e.sh=rnd(2.2,4.5)/Math.min(1.8,1+G.stage*.2);ebul(e.x,e.y,aimAt(e.x,e.y),bsp());}
    if(e.y>H+40||e.x<-60||e.x>W+60)e.dead=true;break;
  case 'dart':
    if(e.state===0){e.y+=170*dt;e.x+=clamp(p.x-e.x,-1,1)*60*dt;e.vx=0;e.vy=170;if(e.age>.9){e.state=1;const a=aimAt(e.x,e.y);e.vx=Math.cos(a)*400;e.vy=Math.sin(a)*400;}}
    else{e.x+=e.vx*dt;e.y+=e.vy*dt;}
    if(e.y>H+40||e.x<-60||e.x>W+60)e.dead=true;break;
  case 'gun':
    if(e.y<130)e.y+=70*dt;else{e.y+=10*dt;e.x=e.x0+Math.sin(e.age*.7)*90;}
    e.sh-=dt;if(e.sh<=0&&e.y>40){e.sh=1.5;const a=aimAt(e.x,e.y);for(let i=-1;i<=1;i++)ebul(e.x,e.y+14,a+i*.22,bsp()-10,6);}
    if(e.y>H+50)e.dead=true;break;
  case 'tank':
    e.y+=(speed()+22)*dt;e.x+=e.vx*dt;if(e.x<50||e.x>W-50)e.vx*=-1;
    e.aim=aimAt(e.x,e.y);e.sh-=dt;if(e.sh<=0&&e.y>20&&e.y<H*.8){e.sh=1.7;ebul(e.x+Math.cos(e.aim)*22,e.y+Math.sin(e.aim)*22,e.aim,bsp()-25,5);}
    if(e.y>H+50)e.dead=true;break;
  case 'turret':
    e.y+=speed()*dt;e.aim=aimAt(e.x,e.y);e.sh-=dt;
    if(e.sh<=0&&e.y>20&&e.y<H*.8){e.sh=2;for(let i=0;i<2;i++)ebul(e.x,e.y,e.aim+(i?.12:-.12),bsp()-15,5);}

function updateBoss(dt){

      if(st>=5){
        G.score+=G.lives*2000;G.state='win';G.winT=0;G.en.length=0;

    case 1:b.x=150+Math.sin(b.t*.4)*90;b.y=195+Math.sin(b.t*.7)*10;break;

  b.sp-=dt;b.t2-=dt;b.ring-=dt;
  switch(st){

      if(b.sp<=0){b.sp=f>.66?.16:.22;b.ang+=.37;ebul(b.x,b.y+20,b.ang,sp-30,5);ebul(b.x,b.y+20,b.ang+Math.PI,sp-30,5);}
      if(f<.66&&b.t2<=0){b.t2=1.3;const a=aimAt(b.x,b.y);for(let i=-2;i<=2;i++)ebul(b.x,b.y+30,a+i*.2,sp,6);}
      if(f<.33&&b.ring<=0){b.ring=2.3;for(let i=0;i<26;i++)ebul(b.x,b.y,i*TAU/26+b.t,sp-40,5);}
      break;
    case 1:
      if(b.t2<=0){b.t2=f>.5?1.2:.85;for(const ty of[64,26,-66]){const tyy=b.y+ty,a=aimAt(b.x,tyy);ebul(b.x,tyy,a-.07,sp-20,7);ebul(b.x,tyy,a+.07,sp-20,7);}}
      if(f<.66&&b.sp<=0){b.sp=.2;b.ang+=.5;ebul(b.x-26,b.y,b.ang,sp-40,5);ebul(b.x+26,b.y,b.ang+Math.PI,sp-40,5);}
      if(f<.33&&b.ring<=0){b.ring=1.8;for(let i=0;i<7;i++){ebul(b.x-30,b.y-40+i*14,Math.PI/2+.7,sp-30,5);ebul(b.x+30,b.y-40+i*14,Math.PI/2-.7,sp-30,5);}}
      break;
    case 2:{
      const ay=b.y+10;
      if(b.t2<=0){b.t2=f>.5?1.5:1.1;const a=aimAt(b.x,ay);for(let i=-1;i<=1;i++)ebul(b.x+Math.cos(a)*90,ay+Math.sin(a)*90,a+i*.16,sp-30,8);}
      if(f<.66&&b.sp<=0){b.sp=.12;ebul(b.x-34,b.y+52,aimAt(b.x-34,b.y+52)+Math.sin(b.t*3)*.35,sp,4);ebul(b.x+34,b.y+52,aimAt(b.x+34,b.y+52)-Math.sin(b.t*3)*.35,sp,4);}
      if(f<.33&&b.ring<=0){b.ring=2.4;for(let i=0;i<22;i++)ebul(b.x,b.y,i*TAU/22+b.t,sp-45,5);}
      break;}
    case 3:{

        if(act&&b.tt[i]<=0){b.tt[i]=rnd(1.2,2)*(f<.33?.7:1);const tx=b.x+offs[i],a=aimAt(tx,b.y);ebul(tx,b.y+10,a,sp-10,6);if(f<.33){ebul(tx,b.y+10,a+.2,sp-10,5);ebul(tx,b.y+10,a-.2,sp-10,5);}}}

      if(f<.66&&b.sp<=0){b.sp=1.3;const a=aimAt(b.x,b.y);for(let i=-3;i<=3;i++)ebul(b.x,b.y+20,a+i*.17,sp+10,5);}
      if(f<.33&&b.ring<=0){b.ring=.14;b.ang+=.4;ebul(b.x-100,b.y+10,b.ang,sp-30,5);ebul(b.x+100,b.y+10,-b.ang,sp-30,5);}

        if(b.tt[i]<=0){b.tt[i]=(f<.25?.9:1.6)+rnd(0,.6)+i*.05;const tx=b.x+em[i][0],ty=b.y+em[i][1],a=aimAt(tx,ty);for(let k=-1;k<=1;k++)ebul(tx,ty,a+k*.13,sp-10,5);}}
      if(f<.66&&b.sp<=0){b.sp=.17;b.ang+=.31;for(let k=0;k<3;k++)ebul(b.x,b.y,b.ang+k*TAU/3,sp-35,5);}
      if(f<.5&&b.ring<=0){b.ring=2.2;for(let i=0;i<30;i++)ebul(b.x,b.y,i*TAU/30+b.t*.5,sp-40,5);}
    }

}
function hurtBoss(d){

const inBoss=(x,y,m)=>{const b=G.boss;if(!b)return false;return Math.pow(Math.abs(x-b.x)/(b.hw+m),b.n)+Math.pow(Math.abs(y-b.y)/(b.hh+m),b.n)<1;};
const speed=()=>112+G.stage*8;

/* ---------- player ---------- */
function shooters(){
  const p=G.p,a=[{x:p.x,y:p.y-14,i:-1,ox:0}];
  G.wing.forEach((w,i)=>a.push({x:w.x,y:w.y-10,i,ox:offs(p.form,i)[0]}));return a;

function fireGuns(){

function fireBombs(){

function bombBlast(x,y){

function loseWing(i){

function playerHit(){

function targetsHit(x,y,r){
  const p=G.p;if(p.dead>0||p.inv>0)return false;
  if(Math.hypot(x-p.x,y-p.y)<r+7){playerHit();return true;}
  for(let i=0;i<G.wing.length;i++){const w=G.wing[i];if(Math.hypot(x-w.x,y-w.y)<r+9){loseWing(i);return true;}}
  return false;
}

/* ---------- update ---------- */
function updateFX(dt){
  for(const q of G.parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=1-2.2*dt;q.vy*=1-2.2*dt;q.life-=dt;}
  G.parts=G.parts.filter(q=>q.life>0);
  for(const r of G.rings){r.life-=dt;r.r+=(r.max-r.r)*Math.min(1,dt*9);}
  G.rings=G.rings.filter(r=>r.life>0);
  for(const f of G.fl){f.life-=dt;f.y-=34*dt;}
  G.fl=G.fl.filter(f=>f.life>0);
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
  G.shake=Math.max(0,G.shake-dt*28);
  {const T=themeOf(Math.floor((scroll-H*.4)/90)),tg=STG[Math.min(T.s,5)].grade;for(let i=0;i<3;i++)G.grade[i]+=(tg[i]-G.grade[i])*Math.min(1,dt*1.5);G.cst=T.s;}
}
function update(dt){
  G.t+=dt;if(G.state!=='brief')scroll+=speed()*dt;updateFX(dt);
  const p=G.p;
  if(G.state==='title'){return;}
  if(G.state==='win'){G.winT+=dt;return;}
  if(G.state==='brief'){G.briefT+=dt;return;}
  if(p.inv>0)p.inv-=dt;if(p.fcd>0)p.fcd-=dt;
  if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0){G.combo=0;G.mult=1;}}
  if(G.state==='over'){return;}
  if(p.dead>0){
    p.dead-=dt;
    if(p.dead<=0){
      if(G.lives<=0){G.state='over';sfx('over');if(G.score>hi){hi=G.score;try{localStorage.setItem('neonscramble.hi',hi);}catch(e){}}}
      else{p.x=W/2;p.y=H-170;p.inv=2.6;G.eb.length=0;}
    }
  }else{
    let dx=(keys['arrowright']||keys['d']?1:0)-(keys['arrowleft']||keys['a']?1:0);
    let dy=(keys['arrowdown']||keys['s']?1:0)-(keys['arrowup']||keys['w']?1:0);
    if(dx&&dy){dx*=.7071;dy*=.7071;}
    p.x=clamp(p.x+dx*330*dt,22,W-22);p.y=clamp(p.y+dy*330*dt,80,H-100);
    p.tilt+=(dx-p.tilt)*Math.min(1,dt*10);
    const fire=true;
    p.fire-=dt;p.bomb-=dt;
    if(fire){
      if(p.fire<=0&&p.form!==1){p.fire=.11;fireGuns();}
      if(p.bomb<=0&&p.form!==0){p.bomb=.46;fireBombs();}
    }
  }
  // wingmen follow
  G.wing.forEach((w,i)=>{const o=offs(p.form,i),k=Math.min(1,dt*9);w.x+=(p.x+o[0]-w.x)*k;w.y+=(p.y+o[1]-w.y)*k;if(w.flash>0)w.flash-=dt;});
  // player bullets
  for(const b of G.pb){b.x+=b.vx*dt;b.y+=b.vy*dt;}
  for(const b of G.pb){
    if(b.y<-20||b.x<-20||b.x>W+20){b.dead=true;continue;}
    for(const e of G.en){
      if(e.dead||!e.air||e.delay>0)continue;
      if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+4){hurt(e,1);b.dead=true;G.parts.push({x:b.x,y:b.y,vx:0,vy:0,life:.15,max:.8,sz:16,g:'white'});break;}
    }
    if(b.dead)continue;
    for(const r of G.rec){
      if(Math.hypot(r.x-b.x,r.y-b.y)<18){r.dead=true;b.dead=true;captureRec(r);break;}
    }
    if(b.dead)continue;
    if(G.boss&&G.boss.dying<=0&&inBoss(b.x,b.y,2)){hurtBoss(.5);b.dead=true;G.parts.push({x:b.x,y:b.y,vx:0,vy:0,life:.15,max:.8,sz:14,g:'white'});}
  }
  G.pb=G.pb.filter(b=>!b.dead);
  // bombs
  for(const b of G.bombs){b.y+=b.vy*dt;b.t-=dt;if(b.t<=0){b.dead=true;bombBlast(b.x,b.y);}}
  G.bombs=G.bombs.filter(b=>!b.dead);
  // director, enemies
  if(G.state==='play'){director(dt);
    if(G.stage===5&&!G.nag){const th=G.themes[G.themes.length-1];if(th.s===5&&scroll>=(th.row+48)*90+H*.5){G.nag=true;banner('NAGASAKI',3.2,CREAM,'9 de agosto de 1945');}}
    G.recT-=dt;
    if(G.recT<=0){G.recT=rnd(7,11);if(G.wing.length+G.rec.length<4&&!G.boss)G.rec.push({x:W/2,y:-30,age:0,ph:rnd(0,TAU),amp:rnd(120,180),dead:false});}
  }
  for(const e of G.en){updateEn(e,dt);if(e.air&&e.delay<=0&&!e.dead&&targetsHit(e.x,e.y,e.r)){hurt(e,e.type==='gun'?3:99);}}
  G.en=G.en.filter(e=>!e.dead);
  updateBoss(dt);
  for(const r of G.rec){r.age+=dt;r.y=-30+r.age*95;r.x=W/2+Math.sin(r.age*1.4+r.ph)*r.amp;if(r.y>H+30)r.dead=true;}
  G.rec=G.rec.filter(r=>!r.dead);
  // enemy bullets
  for(const b of G.eb){b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<-30||b.x>W+30||b.y<-30||b.y>H+30)b.dead=true;else if(targetsHit(b.x,b.y,b.r))b.dead=true;}
  G.eb=G.eb.filter(b=>!b.dead);
  // pickups
  for(const k of G.pk){k.t+=dt;k.y+=70*dt;if(p.dead<=0&&Math.hypot(k.x-p.x,k.y-p.y)<28){k.dead=true;if(G.lives<5)G.lives++;floatTxt(k.x,k.y,'1UP','#8fe39a');sfx('up');}if(k.y>H+30)k.dead=true;}
  G.pk=G.pk.filter(k=>!k.dead);
  if(G.state==='play'&&G.lives<=0&&p.dead<=0)G.state='over';
}
function captureRec(r){

  if(G.wing.length<4){G.wing.push({x:r.x,y:r.y,flash:.3});floatTxt(r.x,r.y,'FORMAÇÃO +1','#cfe3a0');G.score+=300;}

}

function tint(src,color){const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const g=c.getContext('2d');g.drawImage(src,0,0);g.globalCompositeOperation='source-in';g.fillStyle=color;g.fillRect(0,0,c.width,c.height);return c;}

  txt('ABATIDO',W/2,330,56,RED,'center');
  txt('PONTUAÇÃO',W/2,420,15,AMBER,'center','Oswald',600);txt(String(G.score),W/2,464,40,CREAM,'center');
  txt(G.score>=hi&&G.score>0?'NOVO RECORDE!':'RECORDE '+hi,W/2,506,18,AMBER,'center');
  txt('Campanha alcançada: '+DIST[Math.min(G.stage,5)],W/2,548,16,'#cdbf94','center','Oswald',500);
  if(Math.floor(G.t*2)%2===0)txt('PRESSIONE ESPAÇO OU TOQUE',W/2,640,18,CREAM,'center');
}

/* ---------- educational layer ---------- */
const BRIEF=[
{title:'1. LONDRES',date:'Londres, Inglaterra · 1940 a 1944',
 text:['Durante a guerra, Londres foi bombardeada muitas vezes. Primeiro por aviões, na Blitz (1940–41), e depois, em 1944, por bombas voadoras chamadas V-1 e V-2.','Muitas casas foram destruídas, mas os londrinos não desistiram.'],
 fact:'Para se proteger, as famílias se escondiam em abrigos e até nas estações do metrô. Muitas crianças foram levadas para o campo, onde era mais seguro.',
 mission:'Proteja o céu de Londres. Só há inimigos no ar. Desvie dos balões de barragem, que eram presos por cabos para atrapalhar os aviões inimigos.'},
{title:'2. NORMANDIA',date:'Normandia, França · 6 de junho de 1944 (Dia D)',
 text:['No Dia D, milhares de navios e aviões levaram soldados aliados até as praias da Normandia, na França.','Era o começo da libertação da Europa, que estava ocupada pela Alemanha de Hitler.'],
 fact:'Os Aliados construíram portos artificiais, chamados Mulberry, para descarregar soldados e suprimentos. Foi uma das maiores invasões por mar da história.',
 mission:'Sobrevoe a praia, escolha a formação certa para cada inimigo e derrube as defesas.'},
{title:'3. ARDENAS',date:'Ardenas, Bélgica · dezembro de 1944 a janeiro de 1945',
 text:['No inverno, a Alemanha tentou um último grande ataque nas florestas das Ardenas. Fazia muito frio, com neve e neblina.','Os soldados aliados resistiram, inclusive na cidade de Bastogne.'],
 fact:'No começo, o tempo ruim impedia os aviões de voar. Quando o céu abriu, a aviação aliada voltou a ajudar e fez toda a diferença.',
 mission:'Voe sobre a floresta coberta de neve e destrua os tanques inimigos com a formação CRUZ.'},
{title:'4. VALE DO RENO',date:'Vale do Reno, Alemanha · março de 1945',
 text:['O Rio Reno era a última grande barreira antes do coração da Alemanha. Em março de 1945, os Aliados capturaram a ponte de Remagen ainda de pé e conseguiram atravessar o rio.','A cidade de Colônia foi muito destruída, mas a sua catedral continuou de pé.'],
 fact:'O Brasil também lutou nessa guerra! A Força Expedicionária Brasileira, os "pracinhas", combateu na Itália entre 1944 e 1945.',

{title:'5. BERLIM',date:'Berlim, Alemanha · abril e maio de 1945',
 text:['Em abril de 1945, Berlim, a capital da Alemanha, foi cercada. Grande parte da cidade já estava em ruínas.','Em 8 de maio de 1945, a Alemanha se rendeu e a guerra na Europa terminou.'],
 fact:'Esse dia é lembrado como o Dia da Vitória na Europa. Muitas pessoas saíram às ruas para comemorar o fim da guerra na Europa.',
 mission:'Sobrevoe as ruínas, desvie das torres antiaéreas e enfrente a Asa Voadora.'},
{title:'6. HIROSHIMA E NAGASAKI',date:'Japão · agosto de 1945',
 text:['No Pacífico, a guerra ainda continuava. Em agosto de 1945, duas bombas atômicas foram lançadas sobre as cidades japonesas de Hiroshima (6 de agosto) e Nagasaki (9 de agosto). Muitas pessoas morreram, a maioria civis: famílias, crianças e idosos.','O Japão anunciou a rendição em 15 de agosto, e em 2 de setembro de 1945 a Segunda Guerra terminou.'],
 fact:'Hoje, Hiroshima e Nagasaki são símbolos da paz. Muitas crianças pelo mundo dobram tsurus, garças de papel, pedindo paz.',
 mission:'Última campanha. Aqui o jogo enfrenta apenas defesas militares e, no fim, presta uma homenagem ao fim da guerra.'}
];
function wrapText(s,max,size){
  ctx.font=`500 ${size}px Oswald,sans-serif`;const words=s.split(' '),out=[];let line='';
  for(const w of words){const t=line?line+' '+w:w,m=ctx.measureText(t),wd=(m&&m.width)||t.length*size*.48;if(wd>max&&line){out.push(line);line=w;}else line=t;}
  if(line)out.push(line);return out;
}
function drawBrief(){
  const st=Math.min(G.stage,5),B=BRIEF[st],a=Math.min(1,G.briefT*3);
  ctx.fillStyle='rgba(8,8,4,.74)';ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=a;
  panel(24,60,492,810,false);
  txt('DIÁRIO DE MISSÃO · '+(st+1)+' DE 6',W/2,100,14,AMBER,'center','Oswald',600);
  txt(B.title,W/2,152,B.title.length>14?27:38,CREAM,'center');
  txt(B.date,W/2,182,16,'#cdbf94','center','Oswald',500);
  ctx.fillStyle='rgba(240,180,60,.5)';ctx.fillRect(44,196,452,1.5);
  let y=226;txt('O QUE ACONTECEU',44,y,14,AMBER,'left','Oswald',600);y+=6;
  for(const par of B.text){for(const ln of wrapText(par,450,20)){y+=28;txt(ln,44,y,20,CREAM,'left','Oswald',500);}y+=10;}
  y+=14;
  const fl=wrapText(B.fact,430,19),bh=fl.length*27+44;
  ctx.fillStyle='rgba(74,64,28,.6)';rr(40,y,460,bh,8);ctx.fill();ctx.strokeStyle='rgba(240,180,60,.6)';ctx.lineWidth=1.5;ctx.stroke();
  txt('VOCÊ SABIA?',54,y+24,14,AMBER,'left','Oswald',600);
  fl.forEach((ln,i)=>txt(ln,54,y+52+i*27,19,CREAM,'left','Oswald',500));
  y+=bh+30;
  txt('SUA MISSÃO',44,y,14,AMBER,'left','Oswald',600);
  wrapText(B.mission,450,20).forEach((ln,i)=>txt(ln,44,y+30+i*28,20,CREAM,'left','Oswald',500));
  txt('Os chefes e as armas gigantes são inventados · o resto é história de verdade.',W/2,846,13,'#8a8770','center','Oswald',500);
  ctx.globalAlpha=1;
  if(G.briefT>.5&&Math.floor(G.t*2)%2===0)txt(st===0?'TOQUE OU PRESSIONE ESPAÇO PARA DECOLAR':'TOQUE OU PRESSIONE ESPAÇO PARA CONTINUAR',W/2,910,17,CREAM,'center');
}
const TL=[['1940–44','Londres','bombardeios, Blitz e bombas voadoras'],['6 jun 1944','Normandia','o Dia D, início da libertação'],['dez 1944–jan 1945','Ardenas','último grande ataque alemão'],
 ['mar 1945','Reno','a ponte de Remagen'],['8 mai 1945','Berlim','fim da guerra na Europa'],['ago–set 1945','Japão','fim da Segunda Guerra']];
function drawWin(){
  const w=G.winT;
  if(w>1.2){ctx.fillStyle=`rgba(8,8,4,${Math.min(.86,(w-1.2)*.5)})`;ctx.fillRect(0,0,W,H);}
  if(w<=1.8)return;
  ctx.globalAlpha=Math.min(1,(w-1.8)*.8);
  if(G.winPage===0){
    txt('1945',W/2,230,78,RED,'center');txt('FIM DA GUERRA',W/2,292,34,CREAM,'center');
    ['Em 2 de setembro de 1945, a Segunda Guerra Mundial terminou.','Muitas pessoas perderam a vida e a casa.','Hiroshima e Nagasaki lembram ao mundo','o quanto a guerra pode machucar.','Depois, os países criaram a ONU para tentar','resolver os problemas conversando, e não lutando.'].forEach((l,i)=>txt(l,W/2,352+i*28+(i>1?10:0)+(i>3?10:0),18,'#d8cca4','center','Oswald',500));
    txt('PONTUAÇÃO FINAL',W/2,590,15,AMBER,'center','Oswald',600);txt(String(G.score),W/2,636,42,CREAM,'center');
    txt('Bônus de vidas incluído · Recorde '+hi,W/2,668,15,'#cdbf94','center','Oswald',500);
    if(w>2.5&&Math.floor(G.t*2)%2===0)txt('TOQUE OU PRESSIONE ESPAÇO · LINHA DO TEMPO',W/2,760,17,CREAM,'center');
  }else{
    txt('LINHA DO TEMPO',W/2,150,34,CREAM,'center');
    TL.forEach((q,i)=>{const y=210+i*92;ctx.fillStyle='rgba(74,64,28,.5)';rr(34,y,472,76,8);ctx.fill();
      txt(q[0],50,y+28,15,AMBER,'left','Oswald',600);txt(q[1].toUpperCase(),50,y+56,22,CREAM,'left');txt(q[2],200,y+56,17,'#d8cca4','left','Oswald',500);});
    txt('Parabéns, piloto! Você completou a viagem pela história.',W/2,790,18,CREAM,'center','Oswald',500);
    if(Math.floor(G.t*2)%2===0)txt('TOQUE OU PRESSIONE ESPAÇO PARA JOGAR DE NOVO',W/2,850,17,CREAM,'center');
  }
  ctx.globalAlpha=1;
}
/* ---------- render ---------- */
function render(){
  ctx.setTransform(K,0,0,K,0,0);
  const sh=G.shake;
  ctx.save();if(sh>0)ctx.translate(rnd(-sh,sh),rnd(-sh,sh));
  drawBG();
  ctx.globalCompositeOperation='multiply';ctx.fillStyle=`rgb(${G.grade[0]|0},${G.grade[1]|0},${G.grade[2]|0})`;ctx.fillRect(-20,-20,W+40,H+40);ctx.globalCompositeOperation='source-over';
  for(const e of G.en)if(!e.air&&e.delay<=0)drawEnemy(e);
  drawBoss();
  for(const q of G.parts)if(q.g==='smoke'){const k=Math.max(0,q.life/q.max);glow(GL.smoke,q.x,q.y,q.sz*(2-k),k*.55);}
  for(const b of G.bombs){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.arc(b.x+6,b.y+8,4,0,TAU);ctx.fill();
    ctx.fillStyle='#2a2a26';ctx.beginPath();ctx.ellipse(b.x,b.y,3.5,6,0,0,TAU);ctx.fill();ctx.fillStyle='#e0b050';ctx.fillRect(b.x-3,b.y+4,6,2);}
  for(const k of G.pk){ctx.globalCompositeOperation='lighter';glow(GL.green,k.x,k.y,30,.7);ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#1f3a22';ctx.strokeStyle='#8fe39a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(k.x,k.y,13,0,TAU);ctx.fill();ctx.stroke();txt('1UP',k.x,k.y+4,10,'#8fe39a','center','Oswald',600);}
  for(const r of G.rec){
    drawPlane(r.x,r.y,.75,...REC,Math.cos(r.age*1.4+r.ph),G.t,0,{mark:1});
    ctx.strokeStyle=`rgba(143,227,154,${.5+.3*Math.sin(G.t*8)})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(r.x,r.y,26+Math.sin(G.t*6)*2,0,TAU);ctx.stroke();
  }
  for(const e of G.en)if(e.air&&e.delay<=0)drawEnemy(e);
  const p=G.p;
  G.wing.forEach(w=>drawPlane(w.x,w.y,.64,...WING,p.tilt,G.t,w.flash>0?.7:0,{mark:1}));
  if(p.dead<=0&&(p.inv<=0||Math.floor(G.t*16)%2===0)&&G.state!=='title')drawPlane(p.x,p.y,1,...SILVER,p.tilt,G.t,0,{mark:1});
  drawClouds(true);drawWeather();
  ctx.globalCompositeOperation='lighter';
  for(const b of G.pb){glow(GL.yellow,b.x,b.y,13,.85);ctx.fillStyle='#fff6c0';ctx.fillRect(b.x-1.2,b.y-8,2.4,14);}
  for(const b of G.eb){glow(GL.orange,b.x,b.y,b.r*3.6,.95);}
  for(const q of G.parts)if(q.g!=='smoke'){const k=Math.max(0,q.life/q.max);glow(GL[q.g]||GL.orange,q.x,q.y,q.sz*(k+.4),Math.min(1,k*1.4));}
  ctx.globalCompositeOperation='source-over';
  for(const b of G.eb){ctx.fillStyle='#fff4c8';ctx.beginPath();ctx.arc(b.x,b.y,b.r*.6,0,TAU);ctx.fill();}
  for(const r of G.rings){ctx.globalAlpha=clamp(r.life*3,0,1);ctx.strokeStyle=r.col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,TAU);ctx.stroke();ctx.globalAlpha=1;}
  for(const f of G.fl)txt(String(f.s),f.x,f.y,16,f.col,'center','Oswald',600);
  ctx.restore();
  ctx.drawImage(vig,0,0,W,H);
  if(G.state==='title')drawTitle();
  else{drawHUD();if(G.state==='over')drawOver();if(G.state==='win')drawWin();if(G.state==='brief')drawBrief();
    if(paused){ctx.fillStyle='rgba(8,8,4,.62)';ctx.fillRect(0,0,W,H);txt('PAUSADO',W/2,H/2,44,CREAM,'center');txt('P ou toque para continuar',W/2,H/2+40,17,AMBER,'center','Oswald',500);}}
}

/* ---------- loop ---------- */
let last=0;
function frame(ts){
  const dt=Math.min(.033,(ts-last)/1000||0);last=ts;
  if(!paused||G.state!=='play')update(dt);
  render();requestAnimationFrame(frame);
}
function jump(st,boss){G.stage=st;G.themes.push({row:Math.ceil(scroll/90)+1,s:st});G.en.length=0;G.eb.length=0;G.boss=null;G.bossT=boss?STG[st].bt+1:0;G.grade=STG[st].grade.slice();G.p.inv=999;G.nag=false;G.state='play';}
window.__neon={advance,setScroll(v){scroll=v;},jump,update,render,get G(){return G;},startGame,keys,changeForm};
if(document.fonts&&document.fonts.load){document.fonts.load('40px "Black Ops One"');document.fonts.load('500 14px Oswald');}
requestAnimationFrame(frame);
})();
</script>
